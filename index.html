<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#e9ece4"><meta name="description" content="모모와 함께 자유롭게 탐험하는 3D 집"><title>MOMO — 모모의 집</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body>
<header><a class="logo" href="./" aria-label="모모 홈">momo<span>®</span></a><nav class="rooms" aria-label="방으로 이동"><button data-room="living" aria-pressed="true">거실</button><button data-room="bedroom" aria-pressed="false">침실</button><button data-room="kitchen" aria-pressed="false">주방</button><button data-room="bathroom" aria-pressed="false">화장실</button><button data-room="gym" aria-pressed="false">운동실</button><button data-room="garden" aria-pressed="false">정원</button></nav><button id="help" data-panel="help">조작법</button></header>
<main id="world" tabindex="0" role="region" aria-label="침실, 주방, 화장실, 거실과 정원이 있는 모모의 3D 집"></main>
<section id="action-drawer" hidden aria-label="모모의 행동 메뉴"><div class="activity-panel"><div class="panel-heading"><span id="room-name">LIVING ROOM / 거실</span></div><h2 id="activity-title" class="sr-only">편하게 쉬어가요.</h2><p id="activity-description" class="sr-only">방을 선택하면 모모가 걸어가요.</p><div id="activities"></div><p id="inventory" class="inventory" aria-live="polite"></p><div id="activity-progress" hidden><div><span id="activity-state"></span><button id="cancel-action">그만하기</button></div><progress id="task-progress" max="1" value="0" aria-label="행동 진행률"></progress></div></div><div class="controls"><button id="wave" aria-label="모모 손 흔들기">인사</button><button id="dance" aria-label="모모 춤추기">댄스</button><button id="color" aria-label="로봇 색상 바꾸기">컬러</button><button id="sound" aria-label="소리 켜기" aria-pressed="false">소리 끔</button><button id="motion" aria-label="애니메이션 일시 정지" aria-pressed="false">Ⅱ</button><button data-panel="about">모모 소개</button><button data-panel="world">공간 소개</button></div><div class="needs"><label>에너지 <meter id="energy" min="0" max="100" value="76"></meter></label><label>포만감 <meter id="food" min="0" max="100" value="65"></meter></label><label>청결 <meter id="clean" min="0" max="100" value="82"></meter></label></div></section>
<footer><button id="toggle-actions" aria-expanded="false" aria-controls="action-drawer">전체 행동</button><div id="bubble" role="status" aria-live="polite">가구 앞으로 걸어가 Space를 눌러보세요.</div><button id="stop-routine" hidden>행동 중지</button><div class="camera-controls" aria-label="카메라 조작"><button id="overview" aria-label="집 전체 보기">전체 보기</button><button id="follow" aria-pressed="false">따라가기</button><button id="zoom-in" aria-label="확대">＋</button><button id="zoom-out" aria-label="축소">−</button></div></footer>
<dialog id="dialog"><button class="close" aria-label="닫기">×</button><h2 id="dialog-title"></h2><p id="dialog-copy"></p><button class="primary close-bottom">다시 모모에게</button></dialog><div id="fallback" hidden>3D 화면을 불러오지 못했어요. WebGL을 지원하는 브라우저에서 다시 열어주세요.</div><script type="module" src="app.js"></script></body></html>
